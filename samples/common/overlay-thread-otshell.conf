# Disables automatic network bring up, allowing for manual setup from shell.
# A dataset stored by the manual setup is used to start Thread after reboot.

CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_JOINER_AUTOSTART=n
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_KNX_THREAD_AUTOSTART_COMMISSIONED=y
